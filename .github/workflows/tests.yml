name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests and import check
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import every app module
        run: python -c "import model, view, controller, data_access, json_adapter, yfinance_adapter, polygon_adapter, alpha_vantage_adapter, plot_utils, mpl_canvas, pubsub, decorators"
      - name: Run unit tests
        run: python -m unittest discover -s Test -p "test.py" -v
